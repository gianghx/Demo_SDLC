<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chat với tài liệu{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --fg:#1d2330; --muted:#5b6475; --card:#fff; --line:#dfe3ea; --accent:#2457d6; --bad:#b3261e; --ok:#1b7f3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171d; --fg:#e6e9ef; --muted:#9aa3b2; --card:#1c2029; --line:#2d3340; --accent:#7aa2ff; --bad:#ff8a80; --ok:#6fd08c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
    header a, header button { color:var(--accent); background:none; border:0; font:inherit; cursor:pointer; margin-left:12px; text-decoration:none; }
    main { max-width:1100px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
    h1,h2 { margin:0 0 12px; font-size:1.2em; }
    input, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
    button.primary { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; }
    button.small { padding:2px 8px; font-size:.85em; }
    label { display:block; margin:10px 0 4px; color:var(--muted); }
    .msg { padding:8px 12px; border-radius:6px; margin-bottom:12px; background:var(--bg); border:1px solid var(--line); }
    .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    .muted { color:var(--muted); }
    .narrow { max-width:380px; margin:48px auto; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
