{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block body %}
<main class="narrow">
  <div class="card">
    <h1>Đăng nhập</h1>
    {% if message %}<div class="msg bad">{{ message }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" required>
      <p><button class="primary" type="submit">Đăng nhập</button></p>
    </form>
    <p class="muted">Chưa có tài khoản? <a href="/register">Đăng ký</a> (cần admin duyệt)</p>
  </div>
</main>
{% endblock %}
